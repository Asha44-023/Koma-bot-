name: run-bot-v136
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: 
      group: bot-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            active.json
            cooldown.json
          key: bot-state-v136-fixed
          restore-keys: |
            bot-state-v136-fixed
            bot-state-v135-
      - name: Run V136
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py --once
          echo "--- ACTIVE ---"; cat active.json || echo "{}" > active.json
          echo "--- COOLDOWN ---"; cat cooldown.json || echo '{"signals":{},"daily_pnl":0.0}' > cooldown.json
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            active.json
            cooldown.json
          key: bot-state-v136-fixed
