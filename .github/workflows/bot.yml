name: V190-BUY-SELL-FIXED
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write
    concurrency:
      group: bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install requests pytz colorama numpy

      - name: Run bot
        run: python bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          [ -f active.json ] || echo '{}' > active.json
          [ -f cooldown.json ] || echo '{"daily_pnl":0,"last_day":"2025-01-01"}' > cooldown.json
          [ -f stats_v186.json ] || echo '{"closed":[],"open":{},"wins":0,"losses":0}' > stats_v186.json
          [ -f sent_signals.json ] || echo '{}' > sent_signals.json
          git add -f active.json cooldown.json stats_v186.json sent_signals.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "update V190 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
