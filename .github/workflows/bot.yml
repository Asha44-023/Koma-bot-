name: Run Crypto Bot V46.4 COLOR TREND
on:
  schedule:
    - cron: '*/8 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz matplotlib

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v46-4-color-${{ github.run_id }}
          restore-keys: |
            bot-cache-v46-4-color-
            bot-cache-v46-3-trend-
            bot-cache-v46-reform-50-

      - name: Ensure files
        run: |
          if [ ! -f cooldown.json ]; then echo '{"signals":{}}' > cooldown.json; fi
          if [ ! -f active.json ]; then echo '{}' > active.json; fi
          rm -f /tmp/bot.lock

      - name: Run bot + Trend + Image in one go
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== SCAN ==="
          python bot.py --once
          echo "=== TREND COLOR + IMAGE ==="
          python bot.py --trend

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v46-4-color-${{ github.run_id }}
