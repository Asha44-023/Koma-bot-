name: Run Bot V175-COIN-ONLY-BOTH
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz colorama
      - run: python bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -f active.json cooldown.json stats_v157.json seasonality.json
          git diff --staged --quiet || git commit -m "update state V175-COIN-ONLY-BOTH"
          git push
