name: run-bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: koma-bot-lock
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pytz numpy

      - uses: actions/cache/restore@v4
        with:
          path: |
            active.json
            cooldown.json
            stats.json
          key: bot-cache-v102-stats
          restore-keys: |
            bot-cache-v102-stats

      - name: Ensure files + Fix time + Restore PnL
        run: |
          [ -f active.json ] || echo '{}' > active.json
          [ -f stats.json ] || echo '{"total":0,"tp2":0,"sl":0,"sl_after_tp1":0,"timeout_win":0,"timeout_loss":0,"be_stop":0,"by_face":{},"by_symbol":{}}' > stats.json
          [ -f cooldown.json ] || echo '{"signals":{},"wall":{},"daily_pnl":0,"last_day":""}' > cooldown.json
          python3 -c "
          import json, time, os
          now=time.time()
          a=json.load(open('active.json'))
          for k,v in a.items():
            if v.get('time',0) > now+100:
              print(f'FIX TIME {k}')
              v['time']=now-7200
          json.dump(a, open('active.json','w'))
          c=json.load(open('cooldown.json'))
          if c.get('daily_pnl',0)==0:
            c['daily_pnl']=6.53
            c['last_day']='2026-10-04'
            json.dump(c, open('cooldown.json','w'))
            print('Restored 6.53%')
          "
          cat active.json
          cat cooldown.json
          cat stats.json

      - name: Run bot V102 STATS --once
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            active.json
            cooldown.json
            stats.json
          key: bot-cache-v102-stats
