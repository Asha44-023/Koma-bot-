name: Run Crypto Bot V87 HOLD
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: koma-bot-v87
  cancel-in-progress: true
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
            early.json
            last_id.json
          key: bot-cache-v87-hold
          restore-keys: |
            bot-cache-v87-hold
      - name: Ensure files
        run: |
          [ -f cooldown.json ] || echo '{"signals":{}}' > cooldown.json
          [ -f active.json ] || echo '{}' > active.json
          [ -f early.json ] || echo '{}' > early.json
          [ -f last_id.json ] || echo '{"id":0}' > last_id.json
      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python koma_rsi_47_bot_v87.py --once
      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            cooldown.json
            active.json
            early.json
            last_id.json
          key: bot-cache-v87-hold-${{ github.run_id }}
