name: KOMA + OTHER Bots

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 13-23 * * *'  # was */5 -> now */1 NY active 9am-7pm EST
    - cron: '*/1 0-1 * * *'    # was */5 -> now */1 NY evening
    - cron: '*/30 2-12 * * *'  # keep 30 min slow when US sleeps

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install ccxt pandas requests

      - name: Restore cooldown cache
        uses: actions/cache@v4
        with:
          path: |
            cooldown_koma.json
            cooldown_other.json
          key: cooldown-${{ github.run_id }}
          restore-keys: |
            cooldown-

      - name: Scan BOTH (60s speed) - ALERT ONLY
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # MEXC KEYS REMOVED = NO AUTO-BUY = SAFE MANUAL ONLY
        run: |
          python main.py
