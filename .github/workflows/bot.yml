name: Run Crypto Bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      NODE_NO_WARNINGS: 1
      NODE_OPTIONS: --no-deprecation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz

      - name: Ensure files exist before restore
        run: |
          if [ ! -f cooldown.json ]; then echo '{"signals":{}}' > cooldown.json; fi
          if [ ! -f active.json ]; then echo '{}' > active.json; fi
          if [ ! -f wall_alerts.json ]; then echo '{}' > wall_alerts.json; fi

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
            wall_alerts.json
          key: bot-cache-v34-${{ hashFiles('bot.py') }}
          restore-keys: |
            bot-cache-v34-

      - name: Ensure files after restore
        run: |
          if [ ! -f cooldown.json ]; then echo '{"signals":{}}' > cooldown.json; fi
          if [ ! -f active.json ]; then echo '{}' > active.json; fi
          if [ ! -f wall_alerts.json ]; then echo '{}' > wall_alerts.json; fi
          ls -lh *.json

      - name: Run bot once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cooldown.json
            active.json
            wall_alerts.json
          key: bot-cache-v34-${{ hashFiles('bot.py') }}-${{ github.run_id }}
