name: Run Bot V155-BTC-FILTER
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - run: pip install requests pytz
          
      - name: Run Bot
        run: python bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT }}

      - name: Save State
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add active.json cooldown.json stats_v153.json || true
          git diff --staged --quiet && exit 0
          git commit -m "auto save V155-BTC $(date -u +%Y-%m-%dT%H:%M:00Z)"
          git push
