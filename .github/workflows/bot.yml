name: Run Bot V180-BOTH-ADAPTIVE-ATR
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: koma-bot-v180
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz colorama numpy
      - run: python bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -f active.json cooldown.json stats_v157.json seasonality.json
          git diff --staged --quiet || git commit -m "update state V180-BOTH-ADAPTIVE-ATR $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            echo "retry $i - fixing conflict"
            git rebase --abort 2>/dev/null || true
            git stash 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            git stash pop 2>/dev/null || true
            git add -f active.json cooldown.json stats_v157.json seasonality.json
            git diff --staged --quiet || git commit -m "update state V180-BOTH-ADAPTIVE-ATR retry $i $(date -u +%FT%TZ)" || true
            sleep 3
          done
