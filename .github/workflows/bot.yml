name: Run Crypto Bot V67 FULL SMC

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
            pump_cache.json
            last_trend.json
            winloss.json
            week_tracker.json
          key: bot-cache-v67-${{ github.run_id }}
          restore-keys: |
            bot-cache-v67-
            bot-cache-v66-1-
            bot-cache-v65-

      - name: Ensure files RESET for V67
        run: |
          echo '{"signals":{}}' > cooldown.json
          echo '{}' > active.json
          [ -f pump_cache.json ] || echo '{}' > pump_cache.json
          [ -f last_trend.json ] || echo '{"trend":"RANGE"}' > last_trend.json
          [ -f winloss.json ] || echo '{"wins":0,"losses":0,"history":[]}' > winloss.json
          [ -f week_tracker.json ] || echo '{"start_date":"2026-09-28","end_date":"2026-10-05"}' > week_tracker.json
          rm -f /tmp/bot.lock
          ls -la
          cat bot.py | head -20

      - name: Run bot V67 FULL LOGIC
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== SCAN V67 CRT+TBS+BOS+OB+FVG+62% ==="
          python bot.py --once || true
          echo "=== OVERALL
