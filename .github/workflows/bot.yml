name: Scan V800
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      reset:
        description: 'Reset cooldowns'
        required: false
        default: 'false'
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESET: ${{ github.event.inputs.reset }}
        run: python bot.py
      - name: Save history
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add movers_history.json active.json cooldown.json || true
          git commit -m "save history" || true
          git push || true
