name: run-bot-v119-00HL
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz numpy
      - uses: actions/cache/restore@v4
        with:
          path: |
            active.json
            cooldown.json
            stats.json
          key: bot-cache-v119-
          restore-keys: |
            bot-cache-v119-
            bot-cache-v118-
      - name: Show current ACTIVE trades
        run: |
          echo "=== active.json ==="
          cat active.json || echo "no active file"
          echo ""
          echo "=== cooldown.json ==="
          cat cooldown.json || echo "no cooldown"
      - name: Run bot V119 00:00 + HL
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - name: Show after run
        if: always()
        run: |
          echo "=== after active.json ==="
          cat active.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            active.json
            cooldown.json
            stats.json
          key: bot-cache-v119-
