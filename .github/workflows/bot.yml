name: run-bot-v140-4H-1H-15M-5M
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bot-state-v140-CLEAN
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            active.json
            cooldown.json
          key: bot-state-v140-CLEAN-${{ github.run_id }}
          restore-keys: |
            bot-state-v140-CLEAN-
      - name: Ensure clean state
        run: |
          [ -f active.json ] || echo '{}' > active.json
          [ -f cooldown.json ] || echo '{"signals":{},"daily_pnl":0.0,"last_day":"2026-10-10"}' > cooldown.json
          echo "active: $(cat active.json)"
          echo "cooldown: $(cat cooldown.json)"
      - name: Run V140
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            active.json
            cooldown.json
          key: bot-state-v140-CLEAN-${{ github.run_id }}
