name: grass-bot-v28-6-fixed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: pip install requests

      - name: KILL ALL COOLDOWN
        run: |
          rm -f cooldown.json
          echo '{"signals":{}}' > cooldown.json
          echo "WIPED:"
          cat cooldown.json

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u bot.py --once

      - run: cat cooldown.json
