name: grass-bot-v28-flash-fomo-wick
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/2 * * * *'

concurrency:
  group: grass-bot-v28-flash-fomo-wick
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: cooldown.json
          key: cooldown-v28-${{ github.run_id }}
          restore-keys: |
            cooldown-v28
            cooldown-v26-bothways
      - run: pip install requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: 1
        run: python -u bot.py --once
      - if: always()
        run: |
          cat cooldown.json || echo '{"signals":{}}' > cooldown.json
          touch cooldown.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cooldown.json
          key: cooldown-v28-${{ github.run_id }}
