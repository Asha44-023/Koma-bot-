name: Scan 10 Coins 15M V200.17 TACTICAL FLIPS
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scan-10coins-v200-17-flips
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Run bot V200.17
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - name: Save state + keep alive
        if: always()
        run: |
          git config user.name "koma-bot"
          git config user.email "bot@koma.local"
          echo "alive $(date -u)" > keepalive.txt
          git add active.json cooldown.json oi_history.json whale_log.json keepalive.txt || true
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "4hr keepalive ${{ github.run_id }} [skip ci]" || true
          git push || (git pull --rebase && git push) || true
