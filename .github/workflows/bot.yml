name: Run Crypto Bot V47.8 BREAK+50%
on:
  schedule:
    - cron: '*/15 * * * *'  # every 15m, trend only on change or hourly
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
            pump_cache.json
            last_trend.json
          key: bot-cache-v47-8-${{ github.run_id }}
          restore-keys: |
            bot-cache-v47-8-
            bot-cache-v47-7-
            bot-cache-

      - name: Ensure files
        run: |
          if [ ! -f cooldown.json ]; then echo '{"signals":{}}' > cooldown.json; fi
          if [ ! -f active.json ]; then echo '{}' > active.json; fi
          if [ ! -f pump_cache.json ]; then echo '{}' > pump_cache.json; fi
          if [ ! -f last_trend.json ]; then echo '{}' > last_trend.json; fi
          rm -f /tmp/bot.lock
          ls -la

      - name: Run bot V47.8 BREAK+50%
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== SCAN V47.8 50% SLOW + BREAK FAST ==="
          python bot.py --once
          echo "=== TREND (bias change or hourly) ==="
          python bot.py --trend
          echo "Active: $(cat active.json)"

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cooldown.json
            active.json
            pump_cache.json
            last_trend.json
          key: bot-cache-v47-8-${{ github.run_id }}
