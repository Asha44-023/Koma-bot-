name: grass-bot-v25-sniper
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '*/2 * * * *'

concurrency:
  group: grass-bot-v25-sniper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Restore cooldown
        uses: actions/cache/restore@v4
        with:
          path: cooldown.json
          key: cooldown-v25-obtob-sniper

      - run: pip install requests numpy

      - name: Run V25 OB-TO-OB SNIPER HARAMI+XXX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: 1
        run: |
          echo "=== BOT V25 OB-TO-OB SNIPER - HARAMI+XXX+COUNTER ==="
          python -u main.py --once

      - name: Save cooldown
        uses: actions/cache/save@v4
        if: always()
        with:
          path: cooldown.json
          key: cooldown-v25-obtob-sniper-${{ github.run_id }}
          restore-keys: |
            cooldown-v25-obtob-sniper
