name: Run Crypto Bot V70 BOX STYLE
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v70-box-${{ github.run_id }}
          restore-keys: |
            bot-cache-v70-box-
      - name: Ensure files
        run: |
          [ -f cooldown.json ] || echo '{"signals":{}}' > cooldown.json
          [ -f active.json ] || echo '{}' > active.json
      - name: Run bot 2.5 min loop
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          timeout 150 python bot.py || true
          echo "===ACTIVE==="; cat active.json
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v70-box-${{ github.run_id }}
