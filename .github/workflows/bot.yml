name: Run Bot V182-NO-BLUE-ONLY-BREAKOUT
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: koma-bot-v182-no-blue
  cancel-in-progress: true
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz colorama numpy
      - run: python bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          python -c "import json; json.load(open('active.json'))" 2>/dev/null || echo '{}' > active.json
          [ -f sent_signals.json ] || echo '{}' > sent_signals.json
          [ -f cooldown.json ] || echo '{"signals":{},"daily_pnl":0.0,"last_day":"2026-05-13"}' > cooldown.json
          [ -f stats_v157.json ] || echo '{"closed":[],"open":{}}' > stats_v157.json
          git add -f active.json cooldown.json stats_v157.json seasonality.json sent_signals.json
          git diff --staged --quiet || git commit -m "update state V182-NO-BLUE $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; git rebase --abort 2>/dev/null || true; git stash 2>/dev/null || true; git fetch origin main; git reset --hard origin/main; git stash pop 2>/dev/null || true; [ -f sent_signals.json ] || echo '{}' > sent_signals.json; git add -f active.json cooldown.json stats_v157.json seasonality.json sent_signals.json; git diff --staged --quiet || git commit -m "update state V182-NO-BLUE retry $i $(date -u +%FT%TZ)" || true; sleep 3; done
