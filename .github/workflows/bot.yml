name: Scan 10 Coins 30M V202 LIQUIDITY GRAB MAP
on:
  schedule:
    - cron: '0 * * * *'  # Every 1 hour
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scan-10coins-v202-liq-1h
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Run bot V202 LIQUIDITY GRAB MAP
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - name: Save state + keep alive V202
        if: always()
        run: |
          git config user.name "koma-bot-v202-liq"
          git config user.email "bot-v202-liq@koma.local"
          echo "V202 LIQUIDITY MAP alive $(date -u) BUY->UP TP SELL" > keepalive.txt
          git add active.json cooldown.json oi_history.json whale_log.json keepalive.txt || true
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "V202 LIQUIDITY MAP keepalive ${{ github.run_id }} [skip ci]" || true
          git push || (git pull --rebase && git push) || true
