name: Run Crypto Bot V99 BIAS FLIP

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: koma-bot-v99-flip
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz numpy

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v99-fix
          restore-keys: |
            bot-cache-v99

      - name: Ensure files (auto-fix corrupted)
        run: |
          python3 - << 'PY'
          import json, os
          for fname, default in [
            ("active.json", {}),
            ("cooldown.json", {"signals":{}, "wall":{}})
          ]:
            try:
              if not os.path.exists(fname):
                raise FileNotFoundError()
              d=json.load(open(fname))
              if fname=="active.json" and ("signals" in d):
                raise ValueError("active contains cooldown data - corrupted")
              if fname=="cooldown.json" and "signals" not in d:
                d={"signals":{}, "wall":{}}
              print(f"OK {fname}")
            except Exception as e:
              print(f"FIXING {fname} corrupted: {e}")
              json.dump(default, open(fname,"w"))
          print("active:", open("active.json").read()[:300])
          print("cooldown:", open("cooldown.json").read()[:300])
          PY

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v99-fix-${{ github.run_id }}
