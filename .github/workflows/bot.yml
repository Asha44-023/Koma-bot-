name: grass-bot-v32-final-mansion
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: grass-bot-v32-final
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/cache@v4
        with:
          path: |
            cooldown.json
            active.json
          key: cooldown-v32-final-mansion
          restore-keys: |
            cooldown-v32-final-mansion

      - run: pip install requests

      - name: Clean expired + migrate V32
        run: |
          python3 -c "
          import json,time,os
          now=time.time()
          for fname, expire in [('cooldown.json', 86400), ('active.json', 86400)]:
              if not os.path.exists(fname):
                  open(fname,'w').write(json.dumps({'signals':{}} if 'cooldown' in fname else {}))
                  continue
              try:
                  d=json.load(open(fname))
                  if 'cooldown' in fname:
                      c={k:v for k,v in d.get('signals',{}).items() if now - v.get('t',0) < expire}
                      open(fname,'w').write(json.dumps({'signals':c}))
                      print(f'{fname} kept {len(c)} signals')
                  else:
                      d={k:v for k,v in d.items() if now - v.get('t',0) < expire}
                      open(fname,'w').write(json.dumps(d))
                      print(f'{fname} kept {list(d.keys())} trades')
              except Exception as e:
                  print(f'{fname} error {e} - reset')
                  open(fname,'w').write(json.dumps({'signals':{}} if 'cooldown' in fname else {}))
          "
          echo "=== COOLDOWN ==="; cat cooldown.json
          echo "=== ACTIVE ==="; cat active.json

      - name: Run V32 FINAL
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u bot.py --once

      - name: Show final state
        run: |
          echo "=== FINAL COOLDOWN ==="
          cat cooldown.json
          echo "=== FINAL ACTIVE ==="
          cat active.json
