name: Run Crypto Bot V85 STANDARD BUY SELL CLEAN

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz

      - name: Restore cache V85
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v85-standard-clean
          
      - name: Ensure files
        run: |
          [ -f cooldown.json ] || echo '{"signals":{}}' > cooldown.json
          [ -f active.json ] || echo '{}' > active.json
          echo "=== ACTIVE BEFORE ==="; cat active.json
          echo "=== COOLDOWN BEFORE ==="; cat cooldown.json

      - name: Run bot V85 BUY+SELL
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          BOT_FILE=$(find . -name "bot.py" | head -n1)
          if [ -z "$BOT_FILE" ]; then BOT_FILE=$(find . -name "v85*.py" | head -n1); fi
          echo "FOUND BOT: $BOT_FILE"
          python "$BOT_FILE" --once
          echo "===ACTIVE V85 AFTER==="; cat active.json
          echo "===COOLDOWN AFTER==="; cat cooldown.json

      - name: Save cache V85
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v85-standard-clean
