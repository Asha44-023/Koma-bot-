name: Run Crypto Bot V69 MID ENABLED
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
            last_update.json
            pump_cache.json
            last_trend.json
            winloss.json
            week_tracker.json
          key: bot-cache-v69-mid
          restore-keys: |
            bot-cache-v69-
            bot-cache-
      - name: Ensure files
        run: |
          [ -f cooldown.json ] || echo '{"signals":{}}' > cooldown.json
          [ -f active.json ] || echo '{}' > active.json
          [ -f last_update.json ] || echo '{"id":0}' > last_update.json
          [ -f pump_cache.json ] || echo '{}' > pump_cache.json
          [ -f last_trend.json ] || echo '{"trend":"RANGE"}' > last_trend.json
          [ -f winloss.json ] || echo '{"wins":0,"losses":0,"history":[]}' > winloss.json
          [ -f week_tracker.json ] || echo '{"start_date":"2026-09-28","end_date":"2026-10-05"}' > week_tracker.json
      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py --once
          echo "===ACTIVE==="
          cat active.json
          echo "===COOLDOWN==="
          cat cooldown.json
          echo "===LAST_UPDATE==="
          cat last_update.json
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cooldown.json
            active.json
            last_update.json
            pump_cache.json
            last_trend.json
            winloss.json
            week_tracker.json
          key: bot-cache-v69-mid-${{ github.run_id }}
