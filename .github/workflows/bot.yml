name: Run Bot V157-TRUE-BNR-HH-LL
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - name: Save State + Keepalive
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          date -u > last_run.txt
          date > keepalive.txt
          # create stats if missing so git add doesn't fail
          [ -f stats_v157.json ] || echo '{"closed": [], "open": {}}' > stats_v157.json
          [ -f active.json ] || echo '{}' > active.json
          [ -f cooldown.json ] || echo '{"signals": {}, "daily_pnl": 0.0}' > cooldown.json
          git add active.json cooldown.json stats_v157.json last_run.txt keepalive.txt
          git diff --staged --quiet || git commit -m "V157 $(date -u)"
          git pull --rebase --autostash
          git push
