name: Run Crypto Bot V86.1 FIXED CACHE
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v86-1-${{ github.run_id }}
          restore-keys: |
            bot-cache-v86-1-

      - name: Ensure files
        run: |
          [ -f cooldown.json ] || echo '{"signals":{}}' > cooldown.json
          [ -f active.json ] || echo '{}' > active.json
          cat active.json
          cat cooldown.json

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v86-1-${{ github.run_id }}
