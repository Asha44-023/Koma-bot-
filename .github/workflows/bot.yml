name: run-bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: koma-bot-lock
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pytz numpy

      - uses: actions/cache/restore@v4
        with:
          path: |
            active.json
            cooldown.json
          key: bot-cache-v102-fixed
          restore-keys: |
            bot-cache-v102-fixed
            bot-cache-v101

      - name: Ensure files V102
        run: |
          [ -f active.json ] || echo '{}' > active.json
          if [! -f cooldown.json ] ||! grep -q daily_pnl cooldown.json; then
            echo '{"signals":{},"wall":{},"daily_pnl":0,"last_day":""}' > cooldown.json
          fi
          python3 -c "
          import json, time
          f='active.json'
          try:
              data=json.load(open(f))
              clean={}
              for k,v in data.items():
                  # FIX future time bug
                  t=v.get('time',0)
                  if t> time.time()+10000:
                      print(f'FIX TIME {k} {t} -> now')
                      v['time']=time.time()-100
                  # keep only if tp1_hit or BE set (you manually fixed SAND)
                  # don't delete SAND/LAB - keep all active with valid SL
                  clean[k]=v
              json.dump(clean, open(f,'w'))
              print('active.json ->', clean)
          except Exception as e:
              print('clean error', e)
              open(f,'w').write('{}')
          "
          cat active.json
          cat cooldown.json

      - name: Run bot V101 FIX --once
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            active.json
            cooldown.json
          key: bot-cache-v102-fixed-${{ github.run_id }}
