name: run-bot-v135
on:
  schedule:
    - cron: '*/5 * * * *'  # 5min better than 15 for your coins
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            active.json
            cooldown.json
          key: bot-state-v135-${{ github.run_number }}
          restore-keys: |
            bot-state-v135-
      - name: Run V135
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f bot_v135.py ]; then python bot_v135.py --once
          elif [ -f main_bot.py ]; then python main_bot.py --once
          else python bot.py --once; fi
          cat active.json || echo "{}" > active.json
          cat cooldown.json || echo "{}" > cooldown.json
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            active.json
            cooldown.json
          key: bot-state-v135-${{ github.run_number }}
