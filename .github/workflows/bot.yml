name: Run Crypto Bot V67 FULL SMC

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
            pump_cache.json
            last_trend.json
            winloss.json
            week_tracker.json
          key: bot-cache-v67-${{ github.run_id }}
          restore-keys: |
            bot-cache-v67-
            bot-cache-

      - name: Ensure files
        run: |
          printf '%s\n' '{"signals":{}}' > cooldown.json || true
          printf '%s\n' '{}' > active.json || true
          [ -f pump_cache.json ] || printf '%s\n' '{}' > pump_cache.json
          [ -f last_trend.json ] || printf '%s\n' '{"trend":"RANGE"}' > last_trend.json
          [ -f winloss.json ] || printf '%s\n' '{"wins":0,"losses":0,"history":[]}' > winloss.json
          [ -f week_tracker.json ] || printf '%s\n' '{"start_date":"2026-09-28","end_date":"2026-10-05"}' > week_tracker.json
          rm -f /tmp/bot.lock

      - name: Run bot V67
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py --once
          python bot.py --trend || true
          cat active.json
          cat winloss.json

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cooldown.json
            active.json
            pump_cache.json
            last_trend.json
            winloss.json
            week_tracker.json
          key: bot-cache-v67-${{ github.run_id }}
