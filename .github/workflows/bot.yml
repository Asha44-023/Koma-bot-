name: run-bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz numpy
      - uses: actions/cache/restore@v4
        with:
          path: |
            active.json
            cooldown.json
            stats.json
          key: bot-cache-v110-
          restore-keys: |
            bot-cache-v110-
      - name: Run bot V110 DAILY FACE + 4H BREAK + 15m 62/38 --once
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            active.json
            cooldown.json
            stats.json
          key: bot-cache-v110-${{ github.run_id }}
