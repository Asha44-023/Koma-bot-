name: Run Crypto Bot V97 PURE PRICE

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: koma-bot-v97-pure
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz numpy

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v97-pure
          restore-keys: |
            bot-cache-v97-pure

      - name: Ensure files
        run: |
          [ -f cooldown.json ] || echo '{"signals":{},"wall":{}}' > cooldown.json
          [ -f active.json ] || echo '{}' > active.json
          python -c "import json,os; f='cooldown.json'; d=json.load(open(f)) if os.path.exists(f) else {}; d.setdefault('signals',{}); d.setdefault('wall',{}); json.dump(d,open(f,'w'))"

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v97-pure-${{ github.run_id }}
          restore-keys: |
            bot-cache-v97-pure
