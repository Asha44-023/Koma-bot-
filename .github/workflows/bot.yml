name: Run Bot V157-TRUE-BNR-HH-LL
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - name: Save State + Keepalive
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          date -u > last_run.txt
          date > keepalive.txt
          git add active.json cooldown.json stats_v157.json last_run.txt keepalive.txt || true
          git commit -m "V157 $(date -u)" || echo "no changes"
          git pull --rebase
          git push
