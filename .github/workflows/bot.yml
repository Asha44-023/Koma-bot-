name: Run Crypto Bot V46.8 FIXED BIAS+PNL
on:
  schedule:
    - cron: '*/8 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v46-8
          restore-keys: |
            bot-cache-v46-7-
            bot-cache-

      - name: Ensure files
        run: |
          if [ ! -f cooldown.json ]; then echo '{"signals":{}}' > cooldown.json; fi
          if [ ! -f active.json ]; then echo '{}' > active.json; fi
          rm -f /tmp/bot.lock
          ls -la
          echo "KOMA bias fix: 0.8% threshold"

      - name: Run bot + Trend+Rev
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== SCAN V46.8 ==="
          python bot.py --once
          echo "=== TREND+REVERSAL ==="
          MIN=$(date +%M)
          echo "Minute $MIN - Active: $(cat active.json)"
          if [ "$MIN" -lt 15 ] || [ "$(cat active.json)" != "{}" ]; then
            python bot.py --trend
          else
            echo "Skip trend - no active"
          fi

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v46-8-${{ github.run_id }}
