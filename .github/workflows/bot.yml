name: Run Crypto Bot V84 SMART TIGHT

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz

      - name: Restore cache V84
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v84-smart-tight
          restore-keys: |
            bot-cache-v84-
            bot-cache-v83-
            bot-cache-v82-
            bot-cache-v81-

      - name: Ensure files
        run: |
          echo "=== FILES IN REPO ==="
          ls -la
          echo "=== RECURSIVE ==="
          find . -maxdepth 3 -name "*.py" -type f
          [ -f cooldown.json ] || echo '{"signals":{}}' > cooldown.json
          [ -f active.json ] || echo '{}' > active.json
          echo "=== COOLDOWN BEFORE ==="; cat cooldown.json
          echo "=== ACTIVE BEFORE ==="; cat active.json

      - name: Run bot V84
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          BOT_FILE=$(find . -name "bot.py" | head -n1)
          if [ -z "$BOT_FILE" ]; then BOT_FILE=$(find . -name "v84*.py" | head -n1); fi
          if [ -z "$BOT_FILE" ]; then BOT_FILE=$(find . -name "v8*.py" | head -n1); fi
          if [ -z "$BOT_FILE" ]; then BOT_FILE=$(find . -name "*.py" | grep -E "bot|koma" | head -n1); fi
          echo "FOUND BOT: $BOT_FILE"
          if [ -z "$BOT_FILE" ]; then echo "NO BOT FILE FOUND!"; exit 1; fi
          python "$BOT_FILE" --once
          echo "===ACTIVE V84 AFTER==="; cat active.json
          echo "===COOLDOWN AFTER==="; cat cooldown.json

      - name: Save cache V84
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v84-smart-tight-${{ github.run_id }}
