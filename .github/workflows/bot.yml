name: Scan 10 Coins 30M V203 6LEVEL HIERARCHY
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scan-10coins-v203-6level-1h
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Run bot V203 6LEVEL HIERARCHY
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - name: Save state + keep alive V203
        if: always()
        run: |
          git config user.name "koma-bot-v203-6level"
          git config user.email "bot-v203-6level@koma.local"
          echo "V203 6LEVEL HIERARCHY alive $(date -u) MONTHLY>DAILY WEEKLY>H4 DAILY>H1 H4>M15 H1>M5 M15>M1" > keepalive.txt
          git add active.json cooldown.json oi_history.json whale_log.json keepalive.txt || true
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "V203 6LEVEL LIVE ${{ github.run_id }} MONTHLY>DAILY" || true
          git push || (git pull --rebase && git push) || true
