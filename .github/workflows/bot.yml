name: run-bot-v120-FIX
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - uses: actions/cache/restore@v4
        with:
          path: |
            active.json
            cooldown.json
          key: bot-cache-v120-fix-
          restore-keys: |
            bot-cache-v120-fix-
            bot-cache-v119-clean-
      - name: Show current ACTIVE trades
        run: |
          echo "=== active.json ==="
          cat active.json || echo "no active file"
          echo ""
          echo "=== cooldown.json ==="
          cat cooldown.json || echo "no cooldown"
      - name: Run bot V120 FIX 60/40 + REVERSAL
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - name: Show after run
        if: always()
        run: |
          echo "=== after active.json ==="
          cat active.json || echo "empty"
          echo ""
          echo "=== logs ==="
          cat active.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            active.json
            cooldown.json
          key: bot-cache-v120-fix-${{ github.run_id }}
