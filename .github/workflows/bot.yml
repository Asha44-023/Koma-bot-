name: run-bot-v126-3-COLOR-BOLD
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - uses: actions/cache/restore@v4
        with:
          path: |
            active.json
            cooldown.json
          key: bot-cache-v126-3-color-bold-
          restore-keys: |
            bot-cache-v126-3-color-bold-
            bot-cache-v126-1-telegram-fixed-
            bot-cache-v126-big-net-
      - name: Run bot V126.3 COLOR BOLD
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            active.json
            cooldown.json
          key: bot-cache-v126-3-color-bold-${{ github.run_id }}
