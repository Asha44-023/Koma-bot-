name: V182-BREAKOUT-ONLY
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz colorama numpy
      - run: python bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          python -c "import json; json.load(open('active.json'))" 2>/dev/null || echo '{}' > active.json
          [ -f sent_signals.json ] || echo '{}' > sent_signals.json
          git add -f active.json cooldown.json stats_v157.json seasonality.json sent_signals.json
          git diff --staged --quiet || git commit -m "update V182 $(date -u +%FT%TZ)"
          git pull --rebase --autostash && git push
