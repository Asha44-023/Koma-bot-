name: Run Crypto Bot V46.3 TREND HL
on:
  schedule:
    - cron: '*/8 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'once'
        type: choice
        options:
          - once
          - trend

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz

      - name: Restore cache V46.3 TREND
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v46.3-trend-${{ github.run_id }}
          restore-keys: |
            bot-cache-v46.3-trend-
            bot-cache-v46-reform-50-
            bot-cache-v45.1-fast-slow-
            bot-cache-v44-breaker-

      - name: Ensure files
        run: |
          if [ ! -f cooldown.json ]; then echo '{"signals":{}}' > cooldown.json; fi
          if [ ! -f active.json ]; then echo '{}' > active.json; fi
          rm -f /tmp/bot.lock
          echo "=== cooldown ==="; cat cooldown.json
          echo "=== active ==="; cat active.json
          echo "=== bot version ==="; head -n 1 bot.py

      - name: Run bot once
        if: ${
