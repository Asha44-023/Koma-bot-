name: Scan 8 Coins 15M V200.7 AFAR BREAKDOWN FINAL

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scan-8coins-v200-7-afar-final
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pytz

      - name: Run bot once V200.7 AFAR - 77K->90K->80K->109K MAP + ANTI-WICK
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Save state (throttle-safe)
        run: |
          git config user.name "koma-bot"
          git config user.email "bot@koma.local"
          git add active.json cooldown.json stats_v199.json trade_journal.csv || true
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "V200.7-AFAR-FINAL BTC 90K->80K->109K MAP ${{ github.run_id }} $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            echo "Push failed, retry $i in 30s"
            sleep 30
          done
