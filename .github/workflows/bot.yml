name: Scan 10 Coins 30M V203.1 BETA-RSI HIERARCHY
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scan-10coins-v203-1-beta-rsi
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Run bot V203.1 BETA-RSI HIERARCHY DEBUG
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - name: Save state + keep alive V203.1
        if: always()
        run: |
          git config user.name "koma-bot-v203-1-beta-rsi"
          git config user.email "bot-v203-1@koma.local"
          echo "V203.1 BETA-RSI alive $(date -u) VELVET 15/85 KOMA 18/82 BTC 20/80 MONTHLY>DAILY" > keepalive.txt
          git add active.json cooldown.json oi_history.json whale_log.json keepalive.txt || true
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "V203.1 BETA-RSI LIVE ${{ github.run_id }} 15-85 PUMPERS" || true
          git push || (git pull --rebase && git push) || true
