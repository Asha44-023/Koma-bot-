name: KOMA + OTHER Bots

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 13-23 * * *'
    - cron: '*/5 0-1 * * *'
    - cron: '*/30 2-12 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install ccxt pandas requests

      - name: Restore cooldown cache
        uses: actions/cache@v4
        with:
          path: |
            cooldown_koma.json
            cooldown_other.json
          key: cooldown-${{ github.run_id }}
          restore-keys: |
            cooldown-

      - name: Scan BOTH (60s speed)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET: ${{ secrets.MEXC_SECRET }}
          API_KEY: ${{ secrets.MEXC_API_KEY }}
          SECRET: ${{ secrets.MEXC_SECRET }}
        run: |
          python main.py
