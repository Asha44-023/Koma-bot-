name: run-bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: koma-bot-lock
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz numpy
      - uses: actions/cache/restore@v4
        with:
          path: |
            active.json
            cooldown.json
            stats.json
          key: bot-cache-v103-old-best
      - name: Ensure files
        run: |
          [ -f active.json ] || echo '{}' > active.json
          [ -f cooldown.json ] || echo '{"signals":{},"wall":{},"daily_pnl":6.53,"last_day":"2026-10-04"}' > cooldown.json
          [ -f stats.json ] || echo '{"total":0,"tp2":0,"sl":0,"sl_after_tp1":0,"timeout_win":0,"timeout_loss":0,"be_stop":0,"by_face":{},"by_symbol":{}}' > stats.json
      - name: Run bot V103 OLD BEST --once
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            active.json
            cooldown.json
            stats.json
          key: bot-cache-v103-old-best
