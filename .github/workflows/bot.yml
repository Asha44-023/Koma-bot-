name: Run Bot V163-65-SMART-RANGE-LIQ
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - run: python bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add active.json cooldown.json stats_v157.json
          git diff --staged --quiet || git commit -m "update state V163"
          git push
