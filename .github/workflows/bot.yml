name: Run Crypto Bot V47.5 FINAL NO-TOP-BUY
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
            pump_cache.json
            last_trend.json
          key: bot-cache-v47-5-${{ github.run_id }}
          restore-keys: |
            bot-cache-v47-5-
            bot-cache-v47-4-
            bot-cache-v47-3-
            bot-cache-

      - name: Ensure files
        run: |
          if [ ! -f cooldown.json ]; then echo '{"signals":{}}' > cooldown.json; fi
          if [ ! -f active.json ]; then echo '{}' > active.json; fi
          if [ ! -f pump_cache.json ]; then echo '{}' > pump_cache.json; fi
          if [ ! -f last_trend.json ]; then echo '{}' > last_trend.json; fi
          rm -f /tmp/bot.lock
          ls -la

      - name: Run bot + Trend+Rev + LIQ + NO-TOP
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== SCAN V47.5 NO-TOP ==="
          python bot.py --once
          echo "=== TREND+REVERSAL+LIQ+SCALP (ALWAYS RUN) ==="
          python bot.py --trend
          echo "Active: $(cat active.json)"
          echo "Pump: $(cat pump_cache.json)"

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cooldown.json
            active.json
            pump_cache.json
            last_trend.json
          key: bot-cache-v47-5-${{ github.run_id }}
