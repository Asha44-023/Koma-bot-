name: Run Bot V146 4H SR Chart

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: DEBUG list files
        run: |
          pwd
          ls -la
          ls -la .github/workflows/
          find . -name "*.py" -type f
      - name: Install deps
        run: pip install requests pytz matplotlib
      - name: Run scan once
        run: |
          if [ -f bot.py ]; then python bot.py --once; 
          elif [ -f bot_v146.py ]; then python bot_v146.py --once;
          else echo "NO BOT FILE FOUND"; exit 1; fi
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
