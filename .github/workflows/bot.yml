name: V900 Scan Every 1 Hour

on:
  schedule:
    - cron: '0 * * * *'  # Every hour on the hour, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v900-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run V900 Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save active.json + history
        run: |
          git config user.name "v900-bot"
          git config user.email "bot@v900.local"
          git pull --rebase || true
          git add active.json movers_history.json || true
          git commit -m "V900 scan $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push || echo "Push failed - check permissions"
