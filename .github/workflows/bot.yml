name: Run Crypto Bot V99 BIAS FLIP

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: koma-bot-v99-bias-flip
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz numpy

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v99
          restore-keys: |
            bot-cache-v99
            bot-cache-v98-1

      - name: Ensure files
        run: |
          [ -f cooldown.json ] || echo '{"signals":{},"wall":{}}' > cooldown.json
          [ -f active.json ] || echo '{}' > active.json
          cat active.json
          cat cooldown.json
          python -c "import json,os; f='cooldown.json'; d=json.load(open(f)) if os.path.exists(f) else {}; d.setdefault
