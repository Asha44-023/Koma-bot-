name: KOMA Bot
on:
  workflow_dispatch:
  schedule:
    # PEAK HOURS - Every 10 min (High volatility)
    - cron: '*/10 13-23 * * *'
    # PEAK HOURS - Every 10 min (Midnight continuation)
    - cron: '*/10 0-1 * * *'
    # LOW HOURS - Every 1 hour (Save minutes)
    - cron: '0 2-12 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install
        run: pip install ccxt pandas requests python-telegram-bot python-dotenv

      - name: Scan Market
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
          python koma_engine.py
