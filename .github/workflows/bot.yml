name: grass-bot-v30-5-market
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/cache@v4
        with:
          path: |
            cooldown.json
            active.json
          key: cooldown-v30-5-market-${{ github.run_id }}
          restore-keys: |
            cooldown-v30-5-market-
            cooldown-v30-3-
            cooldown-v28-9-7-simple-

      - run: pip install requests

      - name: Clean expired + migrate
        run: |
          python3 -c "
          import json,time,os
          now=time.time()
          files = [('cooldown.json', 43200), ('active.json', 7200)]
          for fname, expire in files:
              if not os.path.exists(fname):
                  open(fname,'w').write(json.dumps({'signals':{}} if 'cooldown' in fname else {}))
                  continue
              try:
                  d=json.load(open(fname))
                  if 'cooldown' in fname:
                      c={k:v for k,v in d.get('signals',{}).items() if now - v.get('t',0) < expire and v.get('t',0) <= now}
                      open(fname,'w').write(json.dumps({'signals':c}))
                      print(f'{fname} kept {len(c)}')
                  else:
                      # keep only last 2h active, allow new HOLD tracking fields
                      d={k:v for k,v in d.items() if now - v.get('t',0) < expire}
                      open(fname,'w').write(json.dumps(d))
                      print(f'{fname} kept {list(d.keys())}')
              except Exception as e:
                  print(f'{fname} error {e} - reset')
                  open(fname,'w').write(json.dumps({'signals':{}} if 'cooldown' in fname else {}))
          "
          echo "=== COOLDOWN ==="; cat cooldown.json
          echo "=== ACTIVE ==="; cat active.json

      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u bot.py --once

      - run: |
          echo "=== FINAL ==="
          cat cooldown.json
          cat active.json
