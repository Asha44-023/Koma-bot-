name: Run Crypto Bot V61 LONG+SHORT BOTH WAYS
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cooldown.json
            active.json
            pump_cache.json
            last_trend.json
            winloss.json
            week_tracker.json
          key: bot-cache-v61-${{ github.run_id }}
          restore-keys: |
            bot-cache-v61-
            bot-cache-v60-
            bot-cache-

      - name: Ensure files
        run: |
          [ -f cooldown.json ] || echo '{"signals":{}}' > cooldown.json
          [ -f active.json ] || echo '{}' > active.json
          [ -f pump_cache.json ] || echo '{}' > pump_cache.json
          [ -f last_trend.json ] || echo '{}' > last_trend.json
          [ -f winloss.json ] || echo '{"wins":0,"losses":0,"history":[]}' > winloss.json
          [ -f week_tracker.json ] || echo '{"start_date":"2026-09-28","end_date":"2026-10-05"}' > week_tracker.json
          rm -f /tmp/bot.lock
          ls -la

      - name: Run bot V61 LONG+SHORT BOTH WAYS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== SCAN V61 LONG+SHORT ==="
          python bot.py --once || true
          echo "=== TREND + HOLDING ==="
          python bot.py --trend || true
          echo "=== FILES ==="
          cat active.json || echo "no active"
          cat winloss.json || echo "no winloss yet"
          cat week_tracker.json || echo "no week yet"

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cooldown.json
            active.json
            pump_cache.json
            last_trend.json
            winloss.json
            week_tracker.json
          key: bot-cache-v61-${{ github.run_id }}
