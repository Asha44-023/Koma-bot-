name: Run Bot V156-NO-FADE-UP
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python koma_rsi_47_bot.py --once
      - name: Save State
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          date -u > last_run.txt
          git add active.json cooldown.json stats_v153.json last_run.txt || true
          git commit -m "auto save V156 $(date -u)" || echo "no changes to commit"
          git pull --rebase
          git push
