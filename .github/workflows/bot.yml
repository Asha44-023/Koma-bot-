name: Run Bot V148.5.5-FINAL
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install requests pytz matplotlib
      - name: FORCE DELETE active 5
        run: |
          rm -f active.json
          echo '{}' > active.json
          echo '{"signals": {}, "daily_pnl": 0.0, "last_day": "2026-10-15"}' > cooldown.json
          cat active.json
          echo "FORCED TO 0"
      - name: Run scan once
        run: python bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit state
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add active.json cooldown.json || true
          git diff --staged --quiet || git commit -m "auto save V148.5.5 FINAL RESET [skip ci]"
          git push || true
