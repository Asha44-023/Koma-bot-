name: grass-bot-v28-6-fixed
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: cooldown.json
          key: cooldown-v28-6-final
      - run: pip install requests
      - run: |
          echo '{"signals":{}}' > cooldown.json || true
          cat cooldown.json
          python3 -c "
          import json,time
          try:
            d=json.load(open('cooldown.json'))
            now=time.time()
            c={k:v for k,v in d.get('signals',{}).items() if v.get('t',0) <= now+3600 and now-v.get('t',0) < 86400}
            open('cooldown.json','w').write(json.dumps({'signals':c}))
          except: open('cooldown.json','w').write(json.dumps({'signals':{}}))
          "
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u bot.py --once
      - run: cat cooldown.json
