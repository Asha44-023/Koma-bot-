name: Scan V204
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: v204
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python bot.py --once
      - name: Save
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.local"
          git add active.json cooldown.json || true
          git commit -m "V204 run" || true
          git push || true
