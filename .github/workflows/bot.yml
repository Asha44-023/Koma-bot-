name: Run Crypto Bot V86.1 FIXED CACHE

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz

      - name: Restore cache V86.1
        uses: actions/cache@v4
        with:
          path: |
            cooldown.json
            active.json
          key: bot-cache-v86-1-${{ github.run_id }}
          restore-keys: |
            bot-cache-v86-1-
            bot-cache-v86-rule012-div
            
      - name: Ensure files
        run: |
          [ -f cooldown.json ] || echo '{"signals":{}}' > cooldown.json
          [ -f active.json ] || echo '{}' > active.json
          echo "=== ACTIVE BEFORE ==="; cat active.json
          echo "=== COOLDOWN BEFORE ==="; cat cooldown.json
          echo "=== BOT FILES ==="; ls -la *.py

      - name: Run bot V86.1
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # FORCE use bot.py only - no more v85 fallback!
          if [ ! -f bot.py ]; then echo "bot.py NOT FOUND!"; ls -la; exit 1; fi
          echo "FOUND BOT: bot.py"
          python bot.py --once
          echo "===ACTIVE V86.1 AFTER==="; cat active.json
          echo "===COOLDOWN AFTER==="; cat cooldown.json
