name: Scan 10 Coins 30M V203.2 BETA-RSI FIXED
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      reset_cooldowns:
        description: 'Reset all cooldowns to {}'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: scan-10coins-v203-2-beta-rsi-fixed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests pytz

      - name: Reset cooldowns if requested
        if: ${{ inputs.reset_cooldowns == 'true' }}
        run: |
          echo '{}' > cooldown.json
          echo '{}' > active.json
          echo "Cooldowns wiped"

      - name: Run bot V203.2 BETA-RSI FIXED RANGE
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Save state + keep alive V203.2
        if: always()
        run: |
          git config user.name "koma-bot-v203-2-fixed"
          git config user.email "bot-v203-2@koma.local"
          echo "V203.2 FIXED RANGE alive $(date -u) 15/85 PUMPERS tight-range 1.02 fix" > keepalive.txt
          git add active.json cooldown.json oi_history.json whale_log.json keepalive.txt || true
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "V203.2 FIXED RANGE LIVE ${{ github.run_id }} 15-85" || true
          git push || (git pull --rebase && git push) || true
