name: run-bot-v126-BIG-NET
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - uses: actions/cache/restore@v4
        with:
          path: |
            active.json
            cooldown.json
          key: bot-cache-v126-big-net-
          restore-keys: |
            bot-cache-v126-big-net-
            bot-cache-v124-color-
      - name: Reset PNL for new version
        run: |
          echo '{"signals":{},"daily_pnl":0,"last_day":"2026-10-06"}' > cooldown.json
          echo '{}' > active.json
          cat cooldown.json
      - name: Run bot V126 BIG NET
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            active.json
            cooldown.json
          key: bot-cache-v126-big-net-${{ github.run_id }}
