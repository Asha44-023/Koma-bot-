name: grass-bot-v28-9-7-simple
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/cache@v4
        with:
          path: |
            cooldown.json
            active.json
            daily_loss.json
          key: cooldown-v28-9-7-simple-${{ github.run_id }}
          restore-keys: |
            cooldown-v28-9-7-simple-
            cooldown-v28-8-dual-

      - run: pip install requests

      - name: Clean expired + migrate
        run: |
          python3 -c "
          import json,time,os
          now=time.time()
          files = [('cooldown.json', 43200), ('active.json', 7200), ('daily_loss.json', 86400)]
          for fname, expire in files:
              if not os.path.exists(fname):
                  if 'cooldown' in fname:
                      open(fname,'w').write(json.dumps({'signals':{}}))
                  else:
                      open(fname,'w').write(json.dumps({}))
                  continue
              try:
                  d=json.load(open(fname))
                  if 'cooldown' in fname:
                      c={k:v for k,v in d.get('signals',{}).items() if now - v.get('t',0) < expire and v.get('t',0) <= now}
                      open(fname,'w').write(json.dumps({'signals':c}))
                      print(f'{fname} kept {len(c)}')
                  elif 'active' in fname:
                      if d and len(d)>0 and '_' not in list(d.keys())[0]:
                          print('Old ACTIVE format wipe')
                          d={}
                      else:
                          d={k:v for k,v in d.items() if now - v.get('t',0) < expire}
                      open(fname,'w').write(json.dumps(d))
                      print(f'{fname} kept {list(d.keys())}')
              except Exception as e:
                  print(f'{fname} error {e} - reset')
                  if 'cooldown' in fname:
                      open(fname,'w').write(json.dumps({'signals':{}}))
                  else:
                      open(fname,'w').write(json.dumps({}))
          "
          cat cooldown.json
          cat active.json
          cat daily_loss.json 2>/dev/null || echo "no daily loss yet"

      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u bot.py --once

      - run: |
          echo "=== FINAL ==="
          cat cooldown.json
          cat active.json
          cat daily_loss.json 2>/dev/null || echo "no daily file"
