name: scan
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is IMPORTANT for new main.py - saves 2h cooldown
      - name: Load cooldown memory
        uses: actions/cache@v4
        with:
          path: last_alerts.json
          key: solid-cooldown
          restore-keys: |
            solid-cooldown

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install ccxt requests numpy pandas

      - name: Run Scanner
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
