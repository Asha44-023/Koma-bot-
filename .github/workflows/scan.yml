name: Whale Killer Bot - 15min Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: whale-killer-bot
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ccxt pandas numpy requests
          
      - name: Run Killer Bot - KOMA + 6 Coins + Autopilot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          MEXC_SECRET: ${{ secrets.MEXC_API_SECRET }}
          API_SECRET: ${{ secrets.MEXC_API_SECRET }}
        run: |
          python main.py

      - name: Save alerts & trades state
        if: always()
        run: |
          git config --global user.name "whale-killer-bot"
          git config --global user.email "bot@killer.com"
          git add last_alerts.json trades.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "update state [skip ci]" && git push || true)
