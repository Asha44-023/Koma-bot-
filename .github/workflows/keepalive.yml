name: Keep Scheduler Alive
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "koma-bot"
          git config user.email "bot@koma.local"
          git commit --allow-empty -m "keepalive $(date -u +%Y-%m-%d)"
          git push
