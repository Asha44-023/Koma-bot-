name: Keep Scheduler Alive
on:
  schedule:
    - cron: '0 0 * * 0'  # Once a week, Sunday midnight - NOT every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep Alive - Make a real commit
        run: |
          date -u > .keepalive
          git config user.name "v900-bot"
          git config user.email "bot@v900.local"
          git add .keepalive
          git commit -m "Keepalive $(date -u +'%Y-%m-%d')" || echo "No changes"
          git push || echo "Push failed"
