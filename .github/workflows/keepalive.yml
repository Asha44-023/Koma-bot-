name: keepalive
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date > keepalive.txt
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add keepalive.txt
          git commit -m "keepalive $(date -u)" || echo "no change"
          git push
