name: cleanup-old-runs
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: Asha44-023/Koma-bot
          retain_days: 0
          keep_minimum_runs: 0
