name: AUTO KOMA TRADE

on:
  schedule:
    - cron: '*/5 * * * *'  # 5 min, not 2 — save API
  workflow_dispatch:

concurrency:
  group: koma-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache bot memory
        uses: actions/cache@v4
        with:
          path: |
            cooldown.json
            koma_retest_state.json
          key: koma-state-v2
          restore-keys: |
            koma-state-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install ccxt pandas requests

      - run: python main.py
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTOPILOT_ENABLED: "true"
          ENGINE: "AUTO"
